# The gate that blocks merge for ultra_trade.
#
# It runs exactly the three commands AGENTS.md names as the gate, plus the two
# guarantees the constitution makes about how they run:
#
#   - Principle VIII: a default `cargo test --workspace` is safe to run on any
#     machine, offline, with no credentials present.
#   - The pinned toolchain: the gate's verdict must not depend on whose
#     toolchain produced it, so `rust-toolchain.toml` decides and the run
#     records which one it got.
#
# Paths are relative to the repository root, one level above the project.

name: ultra_trade gate

on:
  push:
    branches: [main]
    paths:
      - 'ultra_trade/**'
      - '.github/workflows/ultra-trade.yml'
  pull_request:
    paths:
      - 'ultra_trade/**'
      - '.github/workflows/ultra-trade.yml'

# Least privilege: the gate reads the tree and reports a status. It has no
# reason to write to the repository.
permissions:
  contents: read

# A superseded run proves nothing about the commit that replaced it.
concurrency:
  group: ultra-trade-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ultra_trade

env:
  CARGO_TERM_COLOR: always
  # A backtrace turns "a test panicked" into "a test panicked here".
  RUST_BACKTRACE: 1

jobs:
  gate:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` pins the version and its components; this forces
      # the install up front and prints what the gate is about to judge with.
      - name: Resolve the pinned toolchain
        run: |
          rustup show active-toolchain
          cargo --version
          cargo fmt --version
          cargo clippy --version

      # Keyed on the lockfile: a dependency change must not be judged against a
      # cache built from different sources. `actions/cache` rather than a
      # third-party caching action, to keep this workflow's supply chain to
      # first-party actions only.
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ultra_trade/target
          key: ultra-trade-${{ runner.os }}-cargo-${{ hashFiles('ultra_trade/Cargo.lock', 'ultra_trade/rust-toolchain.toml') }}
          restore-keys: ultra-trade-${{ runner.os }}-cargo-

      # The one place the network is allowed. Everything after this runs
      # `--offline`, so a test that needed a fetch would fail here rather than
      # passing quietly on a machine that happened to have one.
      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --locked --offline -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace --locked --offline

      # The end-to-end wiring, not just the units: a binary that stops running
      # is a broken seam even when every crate's tests pass. Recording and then
      # backtesting the recording exercises the whole chain — engine, codec,
      # file, reader, historical feed — in the order a person would use it.
      - name: Record and backtest smoke
        run: |
          set -euo pipefail
          conf="${RUNNER_TEMP:-/tmp}/smoke.conf"
          log="${RUNNER_TEMP:-/tmp}/smoke-session.log"
          rm -f "$log" "$conf"
          # Two instruments, so the smoke covers more than the single-instrument
          # path every binary used to hardcode.
          cat > "$conf" <<'CONF'
          instrument SMOKE tick 0.01 lot 1 min 1
          instrument OTHER tick 0.01 lot 1 min 1
          limits SMOKE max-position 50 max-exposure 1000000 max-order-notional 500000 max-orders 60 rate-window 60s max-quote-age 30s
          limits OTHER max-position 50 max-exposure 1000000 max-order-notional 500000 max-orders 60 rate-window 60s max-quote-age 30s
          strategy crossover SMOKE window 10 size 5
          # Both strategy kinds, because they exercise opposite halves of the
          # order lifecycle: the crossover takes with market orders, the quoter
          # rests limit orders and has to cancel them.
          strategy quote OTHER half-spread 0.5 size 1 reprice 0.25 max-inventory 10
          CONF
          sed -i 's/^          //' "$conf"
          cargo run -p record --locked --offline -- "$conf" "$log" 500
          cargo run -p backtest --locked --offline -- "$log" "$conf"

          # And the paper path: a bridge-shaped feed, a live clock, a recording,
          # then a backtest over what paper produced.
          md="${RUNNER_TEMP:-/tmp}/smoke-market.txt"
          paper_log="${RUNNER_TEMP:-/tmp}/smoke-paper.log"
          rm -f "$md" "$paper_log"
          for i in $(seq 1 200); do
            t=$((1700000000000000000 + i * 100000000))
            p=$((100 + i % 20))
            echo "Q SMOKE $t $p.00 5 $((p + 1)).00 5"
            echo "T SMOKE $((t + 50000000)) $p.50 1 B"
          done > "$md"
          cargo run -p paper --locked --offline -- "$conf" "$md" "$paper_log" < /dev/null
          cargo run -p backtest --locked --offline -- "$paper_log" "$conf"

          # Read the recording back. This is the only check that the log is
          # decodable by something other than the code that wrote it, and the
          # fills view re-derives the books independently of the session that
          # produced them.
          cargo run -p journal --locked --offline -- "$paper_log" > /dev/null
          cargo run -p journal --locked --offline -- "$paper_log" --all > /dev/null
          cargo run -p journal --locked --offline -- "$paper_log" --fills > /dev/null
          cargo run -p journal --locked --offline -- "$paper_log" --curve > /dev/null

          # A session names a chain of segments, so its records are in
          # `<name>.0.log`. Check that is really where they landed — the whole
          # point of numbering the first segment is that nothing silently
          # reads a bare path and reports part of a session as all of it.
          test -f "${paper_log%.log}.0.log"
          test ! -f "$paper_log"

          # A recording with its tail cut off is the state a crash leaves, and
          # the tool has to survive it rather than refuse the file. Cut into
          # the last record and check it still reports.
          torn="${RUNNER_TEMP:-/tmp}/smoke-torn.log"
          cp "${paper_log%.log}.0.log" "${torn%.log}.0.log"
          truncate -s $(( $(stat -c%s "${torn%.log}.0.log") - 37 )) "${torn%.log}.0.log"
          cargo run -p journal --locked --offline -- "$torn" --fills \
            | grep -q "cut off here"

          # The whole crash cycle, which is the only check that a resumed
          # session comes back holding what it held. Tear the tail off the
          # paper recording, point paper at the same session root, and it must
          # continue the chain rather than refuse or start fresh.
          truncate -s $(( $(stat -c%s "${paper_log%.log}.0.log") - 45 )) \
            "${paper_log%.log}.0.log"
          cargo run -p paper --locked --offline -- "$conf" "$md" "$paper_log" \
            < /dev/null > "${RUNNER_TEMP:-/tmp}/resumed.txt"
          grep -q "RESUMED" "${RUNNER_TEMP:-/tmp}/resumed.txt"
          # A crash is an incident: it comes back halted, and stays that way
          # until an operator says otherwise (contract D-2).
          grep -q "HALTED" "${RUNNER_TEMP:-/tmp}/resumed.txt"
          grep -q "final state     Halted" "${RUNNER_TEMP:-/tmp}/resumed.txt"
          test -f "${paper_log%.log}.1.log"
          # And the two segments read back as one session.
          cargo run -p journal --locked --offline -- "$paper_log" \
            | grep -q "2 segments"
          # A recovery pulls whatever was resting, so the resumed segment must
          # open with cancels rather than leaving quotes live in a halted
          # session (contract D-3).
          cargo run -p journal --locked --offline -- "$paper_log" \
            | grep -q "cancel"

          # Every session ends holding something, so a report that stops at
          # realized is not a result. Check the valuation reaches the surface
          # and says what it marked at.
          cargo run -p journal --locked --offline -- "$paper_log" | grep -q "TOTAL"
          cargo run -p journal --locked --offline -- "$paper_log" | grep -q "marked at"
          # Both clocks are on every event and nothing compared them until now.
          # No network here: the lag is read from the recording's own stamps.
          cargo run -p journal --locked --offline -- "$paper_log" | grep -q "feed lag"

          # A depth feed, through the same line protocol. No network: the levels
          # are written by hand, exactly as the bridge would emit them.
          depth_md="${RUNNER_TEMP:-/tmp}/smoke-depth.txt"
          depth_log="${RUNNER_TEMP:-/tmp}/smoke-depth.log"
          rm -f "$depth_md" "${depth_log%.log}".*.log
          # The bridge's own logic, with no network: a real checksum vector, the
          # timestamp parser against `datetime`, and the delta bookkeeping.
          python3 ultra_trade/tools/test-kraken-stream.py

          # A delta feed: each update removes the levels it replaces. A fixture
          # that only ever adds accumulates prices until the book is crossed,
          # which the gate then refuses as having no usable market data — a real
          # mistake to make once and not worth making in CI.
          prev=""
          for i in $(seq 1 120); do
            t=$((1700000000000000000 + i * 100000000))
            p=$((100 + i % 20))
            if [ -n "$prev" ]; then
              echo "L SMOKE $t B $prev.00 0"
              echo "L SMOKE $t B $((prev - 1)).00 0"
              echo "L SMOKE $t S $((prev + 1)).00 0"
              echo "L SMOKE $t S $((prev + 2)).00 0"
            fi
            echo "L SMOKE $t B $p.00 3"
            echo "L SMOKE $t B $((p - 1)).00 9"
            echo "L SMOKE $t S $((p + 1)).00 2"
            echo "L SMOKE $t S $((p + 2)).00 8"
            echo "A SMOKE $t"
            echo "T SMOKE $((t + 50000000)) $p.50 1 B"
            # Halfway through, a resynchronisation: the book is thrown away and
            # rebuilt, as it would be when a checksum fails.
            if [ "$i" = "60" ]; then
              echo "R SMOKE $t"
              prev=""
            else
              prev=$p
            fi
          done > "$depth_md"
          cargo run -p paper --locked --offline -- "$conf" "$depth_md" "$depth_log" < /dev/null > /dev/null
          cargo run -p journal --locked --offline -- "$depth_log" --all | grep -q "book update applied"
          cargo run -p journal --locked --offline -- "$depth_log" --all | grep -q "book reset"
          # A session that reset mid-stream must keep trading afterwards, so the
          # reset has to leave a usable book rather than an empty one.
          cargo run -p journal --locked --offline -- "$depth_log" | grep -q "BOOK RESYNCS"
          # Walking the book must reach a size the touch model cannot, which is
          # the entire reason depth exists.
          # An order for 5 against a touch of 2 completes only if it can walk.
          # Without depth the strategy re-orders the shortfall for ever and
          # never reaches its target size, so it submits far more orders. Fewer
          # orders is the signal that they are actually finishing.
          touch_orders=$(cargo run -p backtest --locked --offline -- "$depth_log" "$conf" \
            | awk '/^  orders submitted/ {print $3; exit}')
          walk_orders=$(cargo run -p backtest --locked --offline -- "$depth_log" "$conf" --walk-book \
            | awk '/^  orders submitted/ {print $3; exit}')
          echo "orders: touch=$touch_orders walk=$walk_orders"
          test "$walk_orders" -lt "$touch_orders"

          # A sweep over the recording: a grid of variants, split in and out of
          # sample. The nag when there is no split is load-bearing, so it is
          # checked too — a sweep whose top row gets picked with no
          # out-of-sample column is how a strategy gets overfitted.
          cargo run -p sweep --locked --offline -- "$log" "$conf" \
            --vary SMOKE.window=5,10,20 --split 0.7 > "${RUNNER_TEMP:-/tmp}/sweep.txt"
          grep -q "in sample" "${RUNNER_TEMP:-/tmp}/sweep.txt"
          grep -q "out of sample" "${RUNNER_TEMP:-/tmp}/sweep.txt"
          cargo run -p sweep --locked --offline -- "$log" "$conf" \
            --vary SMOKE.window=5,10 | grep -q "No out-of-sample split"
          # A setting the strategy does not take must be refused, not ignored.
          if cargo run -p sweep --locked --offline -- "$log" "$conf" \
               --vary SMOKE.half-spread=1 2>/dev/null; then
            echo "sweep accepted a setting crossover does not take" >&2
            exit 1
          fi

  repeatability:
    name: allocation counter, 20 runs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: gate

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ultra_trade/target
          key: ultra-trade-${{ runner.os }}-cargo-${{ hashFiles('ultra_trade/Cargo.lock', 'ultra_trade/rust-toolchain.toml') }}
          restore-keys: ultra-trade-${{ runner.os }}-cargo-

      - name: Fetch dependencies
        run: cargo fetch --locked

      # The zero-allocation proof installs a global allocator and counts across
      # the whole process, so its result depends on what else the test harness
      # is doing. AGENTS.md: a test whose result depends on timing or
      # concurrency is not proven by one green run — cite the streak.
      - name: Repeat the zero-allocation proofs
        run: |
          set -euo pipefail
          cargo build --tests -p engine --locked --offline
          for run in $(seq 1 20); do
            echo "--- run $run/20 ---"
            cargo test -p engine --test no_alloc --locked --offline -- --exact \
              a_warmed_engine_does_not_allocate_while_processing_an_event
            # The recorded variant runs a writer thread, so its counter sees
            # two threads. Repetition matters more here, not less.
            cargo test -p engine --test no_alloc_recorded --locked --offline -- --exact \
              a_session_being_recorded_to_a_file_does_not_allocate_while_processing_an_event
          done
          echo "20/20 clean"
