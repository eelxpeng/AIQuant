# A paper session on Kraken's BTC and ETH books.
#
#   python3 tools/kraken-stream.py BTC/USD ETH/USD > /tmp/md &
#   cargo run -p paper -- examples/kraken.conf /tmp/md session.log
#
# The streaming bridge is the one to use: about 80ms behind the market against
# the polling bridge's five seconds. `kraken-bridge.py` is still there for when
# a websocket is blocked and only HTTPS gets out.
#
# Then ask what a different policy would have done over the same market:
#
#   cargo run -p backtest -- session.log examples/kraken.conf
#
# Instrument ids come from the order of these lines, and that is what ties this
# file to a recording. Reorder them and a recording made under the old order is
# refused rather than silently reinterpreted.

instrument BTCUSD  tick 0.1   lot 0.00000001  min 0.0001
instrument ETHUSD  tick 0.01  lot 0.00000001  min 0.001

# Every instrument needs a limits line. One without cannot be traded, and that
# is a startup failure rather than something found one refused order at a time.
limits BTCUSD  max-position 2   max-exposure 500000  max-order-notional 200000  max-orders 60  rate-window 60s  max-quote-age 30s
limits ETHUSD  max-position 20  max-exposure 200000  max-order-notional 100000  max-orders 60  rate-window 60s  max-quote-age 30s

# Two strategy kinds, and they take different settings because they are
# different things. A setting that belongs to the other one is refused rather
# than ignored, so you cannot tune a number that does nothing.
#
#   crossover — takes liquidity when a fast average crosses a slow one.
#               `bars` is trades per bar and defaults to 1.
#   quote     — rests a bid and an ask at mid +/- half-spread, and pulls them
#               once the market has drifted `reprice` away. `reprice` defaults
#               to the half-spread. It stops adding to a side at
#               `max-inventory`, which is its own opinion and not a risk
#               limit — the `limits` line above is the risk limit.
strategy crossover BTCUSD  window 20  size 0.5
strategy quote     ETHUSD  half-spread 0.50  size 1  reprice 0.25  max-inventory 10
