[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
types = { path = "../types" }
event = { path = "../event" }
marketdata = { path = "../marketdata" }
risk = { path = "../risk" }
oms = { path = "../oms" }
strategy = { path = "../strategy" }

[dev-dependencies]
trybuild = "1"
simkit = { path = "../simkit" }
sim_venue = { path = "../adapters/sim" }

[[bench]]
name = "step"
# Hand-rolled: the trading path has no third-party dependencies and a benchmark
# is not a reason to acquire the first one.
harness = false
